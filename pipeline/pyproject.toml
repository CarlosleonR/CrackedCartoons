[project]
name = "cracked-cartoons-pipeline"
version = "0.1.0"
description = "Multi-agent pipeline for Cracked Cartoons YouTube Shorts"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.130.0",
    "mutagen>=1.47.0",
]

[project.scripts]
write-episode = "pipeline.agents.writer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
